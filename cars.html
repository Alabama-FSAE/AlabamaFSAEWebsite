<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cars | Crimson Racing</title><meta name="description" content="Explore generations of Crimson Racing Formula SAE cars.">
  <style>
    @font-face{font-family:Barlow;src:url('assets/fonts/barlow-condensed-700.ttf');font-weight:700}@font-face{font-family:Barlow;src:url('assets/fonts/barlow-condensed-900.ttf');font-weight:900}@font-face{font-family:Inter;src:url('assets/fonts/inter-400.ttf')}@font-face{font-family:Inter;src:url('assets/fonts/inter-700.ttf');font-weight:700}
    :root{--red:#9E1B32;--black:#000;--panel:#0a0b0d;--line:#353a40;--text:#fff;--muted:#b6bbc0}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--black);color:var(--text);font:16px/1.5 Inter,Arial,sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}.wrap{width:min(1280px,calc(100% - 42px));margin:auto}.mono{font-size:.67rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.red{color:var(--red)}
    header{height:78px;border-bottom:1px solid rgba(255,255,255,.2);background:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.18));position:fixed;left:0;right:0;top:0;z-index:60}nav{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:44px;height:44px;border:2px solid #fff;transform:skew(-10deg);display:grid;place-items:center;font:900 1.15rem Barlow}.brand b{display:block;font:900 1.24rem/.85 Barlow;text-transform:uppercase}.brand small{font-size:.53rem;letter-spacing:.15em}.links{display:flex;gap:25px;align-items:center;font-size:.68rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.links a{position:relative}.links a:not(.btn):after{content:"";position:absolute;left:0;right:100%;bottom:-9px;height:2px;background:var(--red);transition:.2s}.links a:hover:after,.links a[aria-current="page"]:after{right:0}.btn{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:0 20px;border:1px solid #636770;font-size:.7rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.btn-red{background:var(--red);border-color:var(--red)}.menu{display:none;background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer}
    .archive-intro{min-height:340px;padding:132px 0 64px;background:linear-gradient(105deg,#0b0c0e 0 57%,rgba(158,27,50,.13));border-bottom:1px solid var(--line)}.intro-grid{display:grid;grid-template-columns:1.15fr .85fr;align-items:end;gap:70px}.archive-intro h1{font:900 clamp(4.5rem,9vw,8.4rem)/.75 Barlow;text-transform:uppercase;letter-spacing:-.045em;margin:14px 0 0}.archive-intro p{max-width:500px;color:var(--muted);margin:0 0 7px}.intro-rule{height:3px;width:58px;background:var(--red);margin-bottom:20px}
    .garage-browser{height:632vh;position:relative;background:#050607}.garage-shell{height:calc(100svh - 78px);min-height:650px;position:sticky;top:78px;z-index:4;display:grid;grid-template-columns:minmax(0,1fr) 345px;overflow:hidden;background:#08090a;border-bottom:1px solid var(--line)}.visual{position:relative;min-width:0;overflow:hidden;background:#111}.stage-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.84) contrast(1.07);transition:opacity .22s ease,transform .7s ease;transform:scale(1.01)}.stage-image.switching{opacity:.12;transform:scale(1.035)}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.63),transparent 48%),linear-gradient(0deg,rgba(0,0,0,.93),transparent 61%)}.stage-copy{position:absolute;z-index:2;left:clamp(28px,4vw,66px);right:40px;bottom:clamp(32px,6vh,68px)}.stage-kicker{display:flex;align-items:center;gap:15px}.stage-kicker:before{content:"";width:44px;height:3px;background:var(--red)}.stage-title{font:900 clamp(6.8rem,13vw,13.5rem)/.66 Barlow;text-transform:uppercase;letter-spacing:-.055em;margin:24px 0 0}.stage-title span{color:var(--red)}.stage-year{position:absolute;z-index:1;right:-.04em;top:4%;font:900 clamp(12rem,25vw,28rem)/.7 Barlow;color:rgba(255,255,255,.07);letter-spacing:-.07em}.stage-bottom{margin-top:34px;padding-top:17px;border-top:1px solid rgba(255,255,255,.48);display:flex;justify-content:space-between;align-items:center;gap:20px}.stage-bottom span:last-child{color:#d2d5d7}
    .garage-rail{background:var(--panel);border-left:1px solid var(--line);padding:21px 18px 18px;display:flex;flex-direction:column;min-height:0}.rail-head{display:flex;justify-content:space-between;align-items:end;padding:2px 5px 16px}.rail-head strong{font:900 1.48rem Barlow;text-transform:uppercase;letter-spacing:.035em}.rail-count{color:var(--red)}.car-list{display:grid;grid-template-rows:repeat(12,minmax(38px,1fr));min-height:0;flex:1;border-top:1px solid var(--line)}.car-row{display:grid;grid-template-columns:45px 1fr 42px;align-items:center;border-bottom:1px solid var(--line);position:relative;transition:.22s;background:transparent}.car-row:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);transform:scaleY(0);transition:.22s}.car-row.active{background:#15171a}.car-row.active:before{transform:scaleY(1)}.row-select{display:contents;color:inherit;border:0;background:0;padding:0;font:inherit;cursor:pointer}.car-index{font-size:.56rem;letter-spacing:.1em;color:#71777d;text-align:center}.car-name{font:900 clamp(1.2rem,2.1vh,1.6rem)/1 Barlow;letter-spacing:.03em;text-transform:uppercase;transition:.2s}.car-year{display:block;font:400 .52rem Inter;letter-spacing:.15em;color:#7e848a;margin-top:3px}.car-row.active .car-name{color:var(--red);transform:translateX(4px)}.car-row.active .car-index{color:#fff}.row-arrow{width:31px;height:31px;border:1px solid #51565d;display:grid;place-items:center;justify-self:center;transition:.2s;position:relative;z-index:2}.row-arrow svg{width:15px;fill:none;stroke:#fff;stroke-width:2}.row-arrow:hover,.row-arrow:focus-visible{background:var(--red);border-color:var(--red);outline:2px solid #fff;outline-offset:2px;transform:translateX(2px)}.rail-help{padding:12px 5px 0;color:#71777d;font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between}.scroll-steps{position:absolute;inset:0;z-index:1;pointer-events:none}.car-step{height:55vh;min-height:340px}.car-step:first-child{height:62vh}.car-step:last-child{height:70vh}
    footer{position:relative;z-index:5;padding:28px 0;background:#050608;color:#777c85;font-size:.65rem}.foot{display:flex;justify-content:space-between;gap:30px}
    @media(max-height:760px) and (min-width:901px){.garage-shell{min-height:560px}.garage-rail{padding-top:13px;padding-bottom:12px}.rail-head{padding-bottom:9px}.rail-help{padding-top:7px}.car-list{grid-template-rows:repeat(12,minmax(34px,1fr))}.car-name{font-size:1.15rem}.car-year{display:none}}
    @media(max-width:900px){.links{position:absolute;top:78px;left:0;right:0;background:#090a0c;padding:22px;display:none;flex-direction:column;align-items:stretch;border-bottom:1px solid var(--line)}.links.open{display:flex}.menu{display:block}.intro-grid{grid-template-columns:1fr;gap:32px}.archive-intro p{max-width:650px}.garage-shell{grid-template-columns:1fr;grid-template-rows:minmax(390px,62vh) minmax(205px,38vh);min-height:650px}.garage-rail{border-left:0;border-top:1px solid var(--line);padding:13px 14px}.rail-head{padding:0 4px 9px}.car-list{display:flex;overflow-x:auto;scroll-snap-type:x proximity;border-bottom:1px solid var(--line)}.car-row{min-width:112px;grid-template-columns:1fr 31px;padding:0 6px;scroll-snap-align:start}.car-row:before{top:auto;right:0;width:auto;height:3px;transform:scaleX(0)}.car-row.active:before{transform:scaleX(1)}.car-index,.car-year{display:none}.car-name{font-size:1.2rem;padding-left:5px}.car-row.active .car-name{transform:none}.rail-help{padding-top:8px}.stage-title{font-size:clamp(5rem,22vw,9rem)}}
    @media(max-width:560px){.wrap{width:calc(100% - 28px)}header{height:70px}.links{top:70px}.archive-intro{min-height:315px;padding:112px 0 48px}.archive-intro h1{font-size:4.5rem}.garage-shell{top:70px;height:calc(100svh - 70px);grid-template-rows:minmax(350px,64vh) minmax(190px,36vh)}.stage-copy{left:22px;right:22px;bottom:25px}.stage-bottom{margin-top:24px}.stage-title{font-size:5.5rem}.garage-rail{padding:10px}.rail-head strong{font-size:1.22rem}.rail-help span:last-child{display:none}.foot{display:block}.foot div+div{margin-top:10px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.stage-image,.car-row,.car-name,.row-arrow{transition:none}}
  </style><link rel="stylesheet" href="assets/site-nav.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="archive-intro"><div class="wrap intro-grid"><div><div class="mono red">Crimson Racing // Vehicle archive</div><h1>Race<br><span class="red">garage.</span></h1></div><div><div class="intro-rule"></div><p>Take a look back at the Formula SAE cars that our team has created over the years and the progressions that have been made!</p></div></div></section>
    <section class="garage-browser" id="garage" aria-label="Crimson Racing vehicle archive">
      <div class="garage-shell">
        <div class="visual" aria-live="polite">
          <img class="stage-image" id="stageImage" src="assets/electric-car.jpg" alt="CR26E">
          <div class="stage-year" id="stageYear" aria-hidden="true">26E</div>
          <div class="stage-copy"><div class="stage-kicker mono" id="stageKicker">01 // Current build</div><h2 class="stage-title" id="stageTitle">CR<span>26E</span></h2><div class="stage-bottom mono"><span>Alabama Formula SAE</span><span id="stagePosition">01 / 12</span></div></div>
        </div>
        <aside class="garage-rail" aria-label="Select a car">
          <div class="rail-head"><strong>Car archive</strong><span class="mono rail-count" id="railCount">01 / 12</span></div>
          <div class="car-list" id="carList"></div>
          <div class="rail-help"><span>Scroll to explore</span><span>Arrow opens car</span></div>
        </aside>
      </div>
      <div class="scroll-steps" id="carSteps" aria-hidden="true"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/navigation.js" defer></script>
  <script src="assets/js/includes.js" defer></script>
  <script src="assets/js/cars-page.js" defer></script>
</body></html>
